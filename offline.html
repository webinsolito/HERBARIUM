<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08130e"><title>Herbarium offline</title>
<style>html,body{margin:0;min-height:100%;background:#08130e;color:#f5f1e6;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:28px}.card{max-width:430px;border:1px solid #315342;border-radius:28px;padding:26px;background:radial-gradient(circle at 85% 0,#234834 0,transparent 40%),#10231b;box-shadow:0 28px 70px #0007}.mark{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,#dfe8c7,#5f8d6b);color:#173027;font-size:40px;box-shadow:0 18px 42px #0007,inset 0 2px 9px #fff7}h1{font:600 2rem Georgia,serif;margin:18px 0 8px}p{color:#b3c0b7;line-height:1.55}.status{color:#d2bd78;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase}.btn{width:100%;min-height:48px;border:0;border-radius:15px;background:#d2bd78;color:#172019;font-weight:800;font-size:16px}</style></head>
<body><main class="wrap"><section class="card"><div class="mark">❧</div><p class="status">Modalità offline</p><h1>Herbarium resta locale.</h1><p>La rete non è disponibile. Le osservazioni già salvate restano sul dispositivo; riprova ad aprire l’app quando la cache locale è pronta.</p><button class="btn" onclick="location.reload()">Riprova</button></section></main></body></html>
