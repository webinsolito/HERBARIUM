name: Deploy HERBARIUM Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "herbarium-pages-publish"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Sync HERBARIUM app
        shell: bash
        run: |
          find pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a source/app/. pages/
          touch pages/.nojekyll

      - name: Publish when changed
        shell: bash
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Pages already matches app/"
            exit 0
          fi
          git commit -m "deploy: HERBARIUM ${GITHUB_SHA}"
          git push origin gh-pages
