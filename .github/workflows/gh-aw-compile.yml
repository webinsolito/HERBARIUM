name: Compile HERBARIUM Agentic Workflow

on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: herbarium-gh-aw-compile
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned gh-aw
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/github/gh-aw/releases/download/v0.88.7/linux-amd64 -o /tmp/gh-aw
          echo "37faaaa95f622b910568bc878452f6036f01e951380fdfc41441944a95da43bf  /tmp/gh-aw" | sha256sum -c -
          chmod +x /tmp/gh-aw
          /tmp/gh-aw version

      - name: Compile autopilot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /tmp/gh-aw compile herbarium-autopilot --strict

      - name: Upload compiled lockfile
        uses: actions/upload-artifact@v6
        with:
          name: herbarium-autopilot-lock
          path: .github/workflows/herbarium-autopilot.lock.yml
          if-no-files-found: error
