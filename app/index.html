<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08130e">
<title>Herbarium</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08130e;color:#f5f1e6;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.shell{position:fixed;inset:0;background:#08130e}.runtime{width:100%;height:100%;border:0;display:block;background:#08130e}.boot{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 28%,#214a36 0,transparent 36%),#08130e;transition:opacity .28s ease}.boot.ready{opacity:0;pointer-events:none}.mark{width:88px;height:88px;margin:auto;border-radius:30px;background:linear-gradient(145deg,#c7ddb7,#5f8d6b);box-shadow:0 24px 58px #0008,inset 0 2px 10px #fff6;display:grid;place-items:center;font-size:44px;transform:rotate(-4deg);animation:breathe 1.8s ease-in-out infinite alternate}h1{font:600 2rem Georgia,serif;margin:18px 0 7px}.boot p{color:#aab8af;max-width:330px;line-height:1.5;margin:0 auto}.boot small{display:block;color:#d2bd78;margin-top:18px;letter-spacing:.12em;text-transform:uppercase}@keyframes breathe{to{transform:rotate(2deg) translateY(-3px);box-shadow:0 29px 64px #0009,inset 0 2px 12px #fff7}}@media(prefers-reduced-motion:reduce){.mark{animation:none}.boot{transition:none}}
</style>
</head>
<body>
<main class="shell">
  <div id="boot" class="boot" aria-live="polite"><div><div class="mark" aria-hidden="true">❧</div><h1>Herbarium</h1><p>Preparo fotocamera, libreria e controlli di sicurezza sul dispositivo.</p><small>Privacy-first · fail-closed</small></div></div>
  <iframe id="runtimeFrame" class="runtime" src="./runtime.html" title="Herbarium" allow="camera; geolocation" referrerpolicy="same-origin"></iframe>
</main>
<script type="module">
import { attachToRuntimeFrame } from './field-runtime-guard.js';
import { installAcquisitionGuard } from './acquisition-guard.js';
const frame=document.querySelector('#runtimeFrame'),boot=document.querySelector('#boot');
attachToRuntimeFrame(frame);
frame.addEventListener('load',()=>{try{installAcquisitionGuard(frame.contentDocument)}catch{}boot.classList.add('ready')},{once:true});
</script>
</body>
</html>
