<!doctype html>

<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Herbarium">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Herbarium</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08130e;color:#f5f1e6;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.shell{position:fixed;inset:0;background:#08130e}.runtime{width:100%;height:100%;border:0;display:block;background:#08130e}.boot{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 22%,rgba(55,103,76,.55),transparent 34%),radial-gradient(circle at 82% 76%,rgba(203,178,106,.08),transparent 28%),#08130e;transition:opacity .32s ease}.boot.ready{opacity:0;pointer-events:none}.launch{position:relative;display:grid;justify-items:center;max-width:360px}.launch:before{content:'';position:absolute;width:220px;height:220px;top:-60px;border-radius:50%;background:radial-gradient(circle,rgba(244,236,216,.07),transparent 66%);filter:blur(2px);pointer-events:none}.mark{position:relative;width:96px;height:96px;margin:auto;border-radius:31px;background:radial-gradient(circle at 32% 18%,rgba(255,255,255,.18),transparent 26%),linear-gradient(145deg,#315b45,#10291e 58%,#07120d);border:1px solid rgba(203,178,106,.24);box-shadow:0 26px 62px #0009,inset 0 1px 0 rgba(255,255,255,.13);display:grid;place-items:center;transform:rotate(-3deg);animation:breathe 1.8s ease-in-out infinite alternate}.mark img{width:100%;height:100%;display:block;border-radius:31px}.launch h1{font:600 2.05rem Georgia,serif;margin:19px 0 7px;letter-spacing:-.02em;text-shadow:0 3px 22px #0007}.boot p{color:#b7c3ba;max-width:330px;line-height:1.55;margin:0 auto}.boot small{display:flex;align-items:center;gap:8px;color:#d7c47f;margin-top:18px;letter-spacing:.1em;text-transform:uppercase;font-size:.69rem}.boot small:before,.boot small:after{content:'';width:25px;height:1px;background:linear-gradient(90deg,transparent,rgba(203,178,106,.55))}.boot small:after{transform:scaleX(-1)}@keyframes breathe{to{transform:rotate(1deg) translateY(-3px);box-shadow:0 31px 68px #000a,inset 0 1px 0 rgba(255,255,255,.16)}}@media(max-width:430px){.boot{padding:20px}.mark{width:90px;height:90px;border-radius:29px}.mark img{border-radius:29px}.launch h1{font-size:1.95rem}}@media(max-width:390px){.mark{width:84px;height:84px;border-radius:27px}.mark img{border-radius:27px}.launch h1{font-size:1.85rem}.boot p{font-size:.92rem}}@media(prefers-reduced-motion:reduce){.mark{animation:none}.boot{transition:none}}.pwa-note{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;z-index:5;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);padding:10px 12px;border:1px solid #3a5c4b;border-radius:999px;background:rgba(13,29,23,.96);box-shadow:0 16px 44px #0008;color:#e9f0e8;font-size:.76rem;transition:.22s}.pwa-note.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}.pwa-note button{border:0;border-radius:999px;background:#d2bd78;color:#172019;padding:7px 10px;font-weight:800}</style>
</head><body><main class="shell"><div id="boot" class="boot" aria-live="polite"><div class="launch"><div class="mark" aria-hidden="true"><img src="./icon.svg" alt=""></div><h1>Herbarium</h1><p>Preparo fotocamera, libreria e controlli di sicurezza sul dispositivo.</p><small>Privacy-first · fail-closed</small></div></div><iframe id="runtimeFrame" class="runtime" src="./runtime.html" title="Herbarium" allow="camera; geolocation" referrerpolicy="same-origin"></iframe></main><div id="pwaNote" class="pwa-note" role="status" aria-live="polite"><span id="pwaCopy">Preparazione offline…</span><button id="pwaAction" hidden>Aggiorna</button></div>
<script type="module">
import { attachToRuntimeFrame } from './field-runtime-guard.js';import { installAcquisitionGuard } from './acquisition-guard.js';
const frame=document.querySelector('#runtimeFrame'),boot=document.querySelector('#boot'),note=document.querySelector('#pwaNote'),copy=document.querySelector('#pwaCopy'),action=document.querySelector('#pwaAction');attachToRuntimeFrame(frame);
const bindRuntimeSafety=()=>{try{const doc=frame.contentDocument;if(doc&&!doc.querySelector('link[data-herbarium-premium]')){const style=doc.createElement('link');style.rel='stylesheet';style.href='./premium.css';style.dataset.herbariumPremium='true';doc.head.append(style)}installAcquisitionGuard(doc)}catch{}boot.classList.add('ready')};frame.addEventListener('load',bindRuntimeSafety);try{if(frame.contentDocument?.readyState==='interactive'||frame.contentDocument?.readyState==='complete')queueMicrotask(bindRuntimeSafety)}catch{}
let hideTimer;function pwaMessage(message,{actionable=false,hold=false}={}){clearTimeout(hideTimer);copy.textContent=message;action.hidden=!actionable;note.classList.add('show');if(!hold&&!actionable)hideTimer=setTimeout(()=>note.classList.remove('show'),2600)}
async function registerOffline(){if(!('serviceWorker' in navigator)){pwaMessage('Offline cache non supportata su questo browser.');return}try{const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});const offerUpdate=worker=>{if(!worker)return;action.hidden=false;action.onclick=()=>{worker.postMessage({type:'SKIP_WAITING'});action.disabled=true;copy.textContent='Aggiornamento in applicazione…'};pwaMessage('Aggiornamento Herbarium pronto.',{actionable:true,hold:true})};if(reg.waiting)offerUpdate(reg.waiting);reg.addEventListener('updatefound',()=>{const worker=reg.installing;if(!worker)return;worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)offerUpdate(worker)})});navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload(),{once:true});await navigator.serviceWorker.ready;if(!reg.waiting)pwaMessage('Offline pronto · runtime e controlli salvati sul dispositivo.');navigator.storage?.persist?.().catch(()=>false)}catch(err){pwaMessage('Cache offline non pronta: l’app continua in modalità locale online.')}}registerOffline();
</script></body></html>
