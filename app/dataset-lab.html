<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Herbarium · Dataset Lab</title><style>body{margin:0;background:#08130e;color:#f5f1e6;font:16px -apple-system,BlinkMacSystemFont,sans-serif}.wrap{max-width:720px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 18px 40px}.card{background:linear-gradient(145deg,#173126,#0d1e17);border:1px solid #52735d;border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 18px 45px #0005}h1{font-family:Georgia,serif}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:700}.pick{display:block;margin-top:8px;padding:15px;border:1px dashed #89a88c;border-radius:16px}input{width:100%}button{width:100%;padding:15px;border:0;border-radius:16px;background:#c7ddb7;color:#102017;font-weight:800;font-size:16px}.muted{color:#afc0b5}.result{white-space:pre-wrap;line-height:1.5}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Dataset Lab</h1><p class="muted">Valutazione locale: le foto non vengono inviate in rete. I risultati tecnici non diventano accuracy scientifica finché il corpus non è reale e bilanciato.</p><section class="card grid"><label>🌿 Piante reali<span class="pick"><input id="plant" type="file" accept="image/*" multiple></span></label><label>⛔ Non-piante<span class="pick"><input id="nonplant" type="file" accept="image/*" multiple></span></label></section><button id="run">Analizza corpus sul dispositivo</button><section class="card"><strong>Risultato</strong><div id="out" class="result muted">Seleziona entrambe le classi per una valutazione utile.</div></section></main><script type="module">import{evaluateDataset,decodeImageFile}from'./dataset-evaluator.js';const p=document.querySelector('#plant'),n=document.querySelector('#nonplant'),o=document.querySelector('#out'),b=document.querySelector('#run');b.onclick=async()=>{const entries=[...p.files].map(file=>({file,label:'PLANT'})).concat([...n.files].map(file=>({file,label:'NON_PLANT'})));if(!p.files.length||!n.files.length){o.textContent='Servono foto reali in entrambe le classi: nessuna metrica viene calcolata.';return}b.disabled=true;o.textContent='Analisi locale in corso…';const r=await evaluateDataset(entries,{decode:decodeImageFile});o.textContent=JSON.stringify(r.summary,null,2)+'\nInvalidi: '+r.invalid+'\nMetriche scientifiche: '+(r.scientificMetricsAvailable?'corpus presente; interpretare solo dopo verifica etichette/bilanciamento':'ND');b.disabled=false};</script></body></html>
